  .ms {
    display: grid;
    gap: 2px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 4px;

    width: fit-content;

<body class="g-minesweeper">
<main class="wrap">
  <div class="topbar">
    <h1>minesweeper</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status" aria-live="polite">Tap to reveal. Long-press (or right-click) to flag.</p>
      <p class="status ms-stats"><span>Mines: <span id="mines">0</span></span> <span>· Time: <span id="time">0:00</span></span> <span>· Best: <span id="best">—</span></span> <span>· Won: <span id="record">0/0</span></span></p>
      <button class="btn ghost tool-btn man-trigger" data-man="minesweeper" data-man-title="MINESWEEPER(1)" type="button">
        <span class="q">?</span> man
      </button>
    </div>
    <div class="game-controls">
      <div class="chips" id="chips" role="group" aria-label="Difficulty">
        <button class="chip" data-diff="easy" type="button">Easy</button>
        <button class="chip" data-diff="medium" type="button">Medium</button>
        <button class="chip" data-diff="hard" type="button">Hard</button>
      </div>
    </div>
    <div id="board" class="ms" role="group" aria-label="Minefield"></div>
    <div class="toolbar">
      <button class="btn primary" id="new-btn" type="button">↻ new game</button>
    </div>
  </div>
</main>

<template id="man-minesweeper">
  <h2>Name</h2>
  <p>minesweeper — clear the board without setting off a mine.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each cell is either empty or contains a hidden mine.</li>
    <li>Revealing a numbered cell tells you how many mines touch it (8 neighbors).</li>
    <li>Revealing a blank (zero) cell auto-opens its neighbors in a flood.</li>
    <li>Reveal <strong>every</strong> non-mine cell to win. Reveal a mine to lose.</li>
    <li>Your first click is always safe.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap / left-click</strong> a cell to reveal it.</li>
    <li><strong>Long-press (500ms)</strong> or <strong>right-click</strong> to place / remove a flag.</li>
    <li>The <code>Easy</code> / <code>Medium</code> / <code>Hard</code> chips pick the board: 9×9 with 10 mines, 16×16 with 40, or 20×20 with 80. On a phone the first visit starts on Easy. Bigger boards scroll inside their frame when they don't fit the screen.</li>
    <li><code>↻ new game</code> re-deals the current board.</li>
    <li>The stats line shows mines left (mines minus flags), the clock, your <strong>Best</strong> winning time and <strong>Won</strong> (games won / games played) for the current level, kept on this device. A game counts as played once you open your first cell.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space reveals, <span class="kbd">F</span> flags.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">If a number equals the count of flagged neighbors, all remaining neighbors are safe. If a number equals the count of unknown neighbors, they're all mines.</p>
</template>
