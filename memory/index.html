<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>memory · games</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Memory Match — flip pairs of cards, remember positions, clear the board.">
<link rel="canonical" href="https://wavde.github.io/games/memory/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wavde.github.io/games/memory/">
<meta property="og:title" content="memory · games">
<meta property="og:description" content="Memory Match — flip pairs of cards, remember positions, clear the board.">
<meta property="og:image" content="https://wavde.github.io/games/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<link rel="preload" href="../fonts/fira-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../manpage.css">
<link rel="stylesheet" href="../soft.css">
<style>
  /* Board theme (moved from soft.css) */
  body.g-memory .panel .mem { gap: 8px; }
  body.g-memory .panel .mem .card {
    background: linear-gradient(145deg, #3a4a6a, #4a3a6a);
    border: none;
    border-radius: 14px;
    color: transparent;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  body.g-memory .panel .mem .card:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  body.g-memory .panel .mem .card.flip,
  body.g-memory .panel .mem .card.match {
    background: var(--bg-2);
    color: var(--fg);
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  body.g-memory .panel .mem .card.match {
    background: rgba(109,213,140,0.12);
    border: 1px solid rgba(109,213,140,0.3);
    box-shadow: 0 0 8px rgba(109,213,140,0.15);
  }
  .mem {
    display: grid;
    gap: 6px;
    width: min(460px, 92vw);
    margin: 0 auto;
  }
  /* Note: game.js uses `.card` for memory tiles; hub also uses `.card`.
     Scoping to `.mem .card` avoids any cross-bleed. */
  .mem .card {
    aspect-ratio: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.4rem, 6vw, 2rem);
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
    min-height: 0;
    padding: 0;
  }
  .mem .card:hover { background: var(--panel); }
  .mem .card.flip { background: var(--panel); border-color: var(--border-hi); }
  .mem .card.match { border-color: var(--accent-2); }
  .mem .card .face { opacity: 0; transition: opacity 0.15s; }
  .mem .card.flip .face, .mem .card.match .face { opacity: 1; }

  select {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    padding: 8px 10px;
    font-family: inherit;
    font-size: var(--fs-sm);
    min-height: var(--tap);
  }
</style>
</head>
<body class="g-memory">
<main class="wrap">
  <div class="topbar">
    <h1>memory</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status">Flip two. Match all pairs.</p>
      <p class="status">Moves: <span id="moves">0</span> · Time: <span id="time">0</span>s · Best: <span id="best">—</span></p>
      <button class="btn ghost tool-btn man-trigger" data-man="memory" data-man-title="MEMORY(1)" type="button">
        <span class="q">?</span> man
      </button>
    </div>
    <div class="mem" id="board"></div>
    <div class="controls" style="justify-content:center">
      <button type="button" class="primary" id="reset">New game</button>
      <select id="size" aria-label="Board size">
        <option value="4">4×4</option>
        <option value="6" selected>6×6</option>
        <option value="8">8×8</option>
      </select>
    </div>
  </div>
</main>

<template id="man-memory">
  <h2>Name</h2>
  <p>memory — flip pairs, clear the board, beat your best time.</p>

  <h2>Rules</h2>
  <ul>
    <li>All cards start face-down. Each symbol appears exactly twice.</li>
    <li>Flip two cards per turn. If they match, they stay up; otherwise they flip back.</li>
    <li>Clear every pair to win.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap / click</strong> a card to flip it.</li>
    <li><code>New game</code> shuffles a fresh board. Size dropdown switches between 4×4, 6×6, 8×8.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space flips a card.</li>
  </ul>

  <h2>Notes</h2>
  <p class="muted">Best time is stored per board size.</p>
</template>

<script defer src="../manpage.js"></script>
<script defer src="../gamekit.js"></script>
<script defer src="game.js"></script>
<script>window.addEventListener("load", () => Manpage.autoOpen("memory"));</script>
</body>
</html>
