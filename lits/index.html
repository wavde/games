  body.g-lits .panel .lt-cell[data-t="4"] { background: #dcebef; }
  body.g-lits .panel .lt-cell[data-t="5"] { background: #efe6c8; }

  body.g-lits .panel .lt-cell.eb { border-bottom: 3px solid #141210; }
  body.g-lits .panel .lt-cell.el { border-left: 3px solid #141210; }
  body.g-lits .panel .lt-cell.er { border-right: 3px solid #141210; }
  body.g-lits .panel .lt-cell:hover { filter: brightness(1.04); transform: none; }
  body.g-lits .panel .lt-cell.on::before { content: ""; position: absolute; inset: 10%; border-radius: 3px; background: #2b2622; }
  body.g-lits .panel .lt-cell.on.sL::before { background: #8a4b1e; }
  body.g-lits .panel .lt-cell.on.sI::before { background: #24507a; }
  body.g-lits .panel .lt-cell.on.sT::before { background: #5a2f6e; }

    </div>
  </div>
</main>

<template id="man-lits">
  <h2>Name</h2>
  <p>lits — a Nikoli puzzle named after the four tetromino shapes it uses.</p>

  <h2>Rules</h2>
  <ul>
    <li>Shade exactly four connected cells in every region (the shapes outlined in bold), forming an <strong>L</strong>, <strong>I</strong>, <strong>T</strong>, or <strong>S</strong>. Rotated and mirrored versions count as the same shape.</li>
    <li>All shaded cells on the board connect into one group.</li>
    <li>No 2×2 block is fully shaded.</li>
    <li>Two tetrominoes of the same shape never touch along an edge across a region border.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell to cycle empty → shaded → dot. <strong>Right-click</strong> toggles a dot directly. A dot is just a note to yourself: "not shaded".</li>
    <li>A finished tetromino takes its shape's colour: L brown, I blue, T purple, S green. A full 2×2 block, a region with more than four shaded cells, and touching matching shapes turn red.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the board. <code>↻ new</code> picks another board; the daily board loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space cycles, <span class="kbd">X</span> toggles a dot. Screen readers announce each cell's region and shape.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 6×6, solvable by direct rules. <strong>Medium</strong> — 8×8, needs look-ahead ("if this were shaded…"). <strong>Hard</strong> — 9×9, never solvable by direct rules alone.</li>
    <li>Every board has exactly one solution. Boards come from a bank made and checked ahead of time, since finding one with a single answer takes seconds.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">A four-cell region is its own tetromino. Cells that every possible shape in a region covers are shaded; cells none can reach stay empty. Watch the 2×2 rule where regions meet, and remember that every tetromino has to join the rest.</p>
</template>
