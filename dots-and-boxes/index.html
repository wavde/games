<style>
  .db-board {
    --dot: 12px;
    display: grid;
    width: min(420px, 100%);
    aspect-ratio: 1;
    margin: 8px auto;
    padding: 12px;
    box-sizing: border-box;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
  }
  .db-dot { background: var(--fg); border-radius: 50%; position: relative; z-index: 3; pointer-events: none; }
  body.g-dots-and-boxes .panel .db-line {
    position: relative;
    min-height: 0;
    min-width: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    z-index: 2;
    cursor: default;
  }
  body.g-dots-and-boxes .panel .db-line:hover,
  body.g-dots-and-boxes .panel .db-line:active { background: transparent; transform: none; }
  .db-line::before {
    content: "";
    position: absolute;
    border-radius: 3px;
    background: transparent;
    transition: background .12s;
  }
  .db-line::after { content: ""; position: absolute; }
  .db-h::before { left: 0; right: 0; top: 50%; height: 4px; transform: translateY(-50%); }
  .db-v::before { top: 0; bottom: 0; left: 50%; width: 4px; transform: translateX(-50%); }
  .db-h::after { left: 0; right: 0; top: -14px; bottom: -14px; }
  .db-v::after { top: 0; bottom: 0; left: -14px; right: -14px; }
  body.g-dots-and-boxes .panel .db-line.avail { cursor: pointer; }
  .db-line.avail:hover::before { background: var(--border-hi); }
  .db-line.p1::before { background: var(--accent); }
  .db-line.p2::before { background: var(--accent-2); }
  .db-h.last::before { height: 6px; }
  .db-v.last::before { width: 6px; }
  .db-line.last::before { box-shadow: 0 0 8px rgba(255, 255, 255, 0.35); }
  .db-box { display: grid; place-items: center; font-weight: 700; font-size: clamp(10px, 3.4vw, 15px); color: rgba(0,0,0,0.55); transition: background .2s; }
  .db-box.p1 { background: rgba(245, 184, 0, 0.55); }
  .db-box.p2 { background: rgba(77, 217, 172, 0.55); }
  .db-score .dot { display: inline-block; width: 0.75em; height: 0.75em; border-radius: 50%; vertical-align: -0.05em; }
  .db-score .dot.p1 { background: var(--accent); }

<template id="man-dots-and-boxes">
  <h2>Name</h2>
  <p>dots-and-boxes — draw lines, close boxes, take another turn.</p>

  <h2>Rules</h2>
  <ul>
    <li>Players take turns drawing one line between two neighboring dots.</li>
    <li>Draw the fourth side of a box and you claim it — <strong>and you must move again</strong>.</li>
    <li>When every line is drawn, whoever owns more boxes wins.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> between two dots to draw a line. Lines and boxes take the color of the player who drew or claimed them.</li>
    <li>The most recent line glows. <code>↶ undo</code> takes back your last turn (and the AI's reply).</li>
    <li>Choose a board size, an AI level and who goes first, or play <strong>2 players local</strong>.</li>
    <li>Your win–loss–draw record is kept per AI level and board size.</li>
    <li><strong>Keyboard</strong>: Tab to the board; ←/→ move along a row of lines, ↑/↓ to the next row; Enter or Space draws.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — grabs free boxes, otherwise plays anywhere.</li>
    <li><strong>Medium</strong> — never gives a box away while a safe line exists, and sacrifices as few boxes as possible when forced.</li>
    <li><strong>Hard</strong> — also plans the endgame: it steers who has to open the first chain, opens the cheapest chain when forced, and <em>double-deals</em> (hands back the last two boxes of a long chain) when keeping control pays.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Don't draw a box's third side unless you must. Late in the game the board splits into chains; when you're forced to open one, open the shortest. If you're given a long chain, consider taking all but two boxes and leaving that pair, so your opponent has to open the next chain.</p>
</template>
