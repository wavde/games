<style>
  .pt-grid {
    position: relative;
    display: grid;
    gap: 0;
    width: min(480px, 92vw);
    aspect-ratio: 1;
    margin: 8px auto;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--paper);
    touch-action: none;
    user-select: none;
  }
  .pt-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--rule);
    color: var(--ink);
    font-weight: 800;
    font-size: clamp(0.9rem, 4.2vw, 1.3rem);
    cursor: crosshair;
  }
  .pt-cell.drag { background: var(--select); cursor: grabbing; }
  .pt-rect-overlay {
    position: absolute;
    box-sizing: border-box;
    border: 2px solid var(--ink);
    border-radius: 4px;
    pointer-events: auto;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .pt-rect-overlay.bad { border-color: var(--ink-error); border-style: dashed; background: rgba(179, 38, 30, 0.14) !important; }
  /* Patch colours: light fills that keep the clue numbers readable */
  .pt-rect-overlay.pc0 { background: rgba(214, 96, 110, 0.30); }
  .pt-rect-overlay.pc1 { background: rgba(222, 140, 60, 0.30); }

  .pt-rect-overlay.pc10 { background: rgba(60, 190, 150, 0.30); }

<template id="man-patches">
  <h2>Name</h2>
  <p>patches — sew the grid into rectangles.</p>

  <h2>Rules</h2>
  <ul>
    <li>Divide the grid into <strong>non-overlapping rectangles</strong> so every cell belongs to exactly one.</li>
    <li>Each rectangle must contain <strong>exactly one numbered clue</strong>.</li>
    <li>The rectangle's area (width × height) must equal the clue's number.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Drag</strong> from one corner of a rectangle to the opposite corner to draw it.</li>
    <li><strong>Tap</strong> a drawn rectangle to remove it.</li>
    <li><code>↶ undo</code> removes the last drawn rectangle. <code>↻ reset</code> clears them all.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space marks one corner, move, then Enter again places the rectangle. <span class="kbd">X</span> removes the rectangle under the cursor, Esc cancels.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 5×5. <strong>Medium</strong> — 6×6. <strong>Hard</strong> — 7×7.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with clues that have only one possible rectangle shape — small numbers in a corner, or primes. Use those to lock in walls that constrain the rest.</p>
</template>
