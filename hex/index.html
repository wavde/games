<template id="man-hex">
  <h2>Name</h2>
  <p>hex — the connection game invented by Piet Hein and, independently, John Nash.</p>

  <h2>Rules</h2>
  <ul>
    <li>Take turns colouring one empty hexagon. Red moves first.</li>
    <li><strong>Red</strong> wins by joining the top and bottom edges with an unbroken chain of red cells; <strong>Blue</strong> by joining left and right.</li>
    <li>Hex can't end in a draw: once the board is full, exactly one side has a chain.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> an empty hexagon. The last move has a gold outline; the winning chain lights up.</li>
    <li><code>↶ undo</code> takes back to your last move (not after a finished game against the AI). Your win–loss record is kept per AI level and board size.</li>
    <li><strong>Online with a friend</strong> shows an invite link to send; paste the reply code your friend sends back to connect. The inviter plays red and moves first; changing the size starts a new game on both boards.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move between cells, Enter or Space plays.</li>
  </ul>

  <h2>AI levels</h2>
  <ul>
    <li>The AI fills the rest of the board at random thousands of times and favours the cells it owned in the fills it won. It always takes a winning cell and blocks one that would win for you.</li>
    <li><strong>Easy</strong> uses 150 fills and picks among its top five. <strong>Medium</strong> uses 2,500. <strong>Hard</strong> fills for 1.2 s.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">The centre is strongest. Two of your cells with two shared empty neighbours form a <em>bridge</em>: if your opponent takes one gap, take the other, and they stay joined. Blocking right in front of a chain rarely works; block from a distance.</p>
</template>
