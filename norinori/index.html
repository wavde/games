<template id="man-norinori">
  <h2>Name</h2>
  <p>norinori — のりのり, a Nikoli puzzle of dominoes and regions.</p>

  <h2>Rules</h2>
  <ul>
    <li>Shade exactly <strong>two</strong> cells in every region (the shapes outlined in bold).</li>
    <li>Every shaded cell touches exactly one other shaded cell along an edge, so the shading is a set of dominoes. A domino may cross from one region into another.</li>
    <li>Dominoes never touch each other side-on; touching at a corner is fine.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell to cycle empty → shaded → dot. <strong>Right-click</strong> toggles a dot directly. A dot is just a note to yourself: "not shaded".</li>
    <li>Shaded cells with too many shaded neighbours, or in a region with more than two, turn red.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the board. <code>↻ new</code> picks another board; the daily board loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space cycles, <span class="kbd">X</span> toggles a dot. Screen readers announce each cell's region.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 6×6, solvable by direct rules. <strong>Medium</strong> — 7×7, needs look-ahead ("if this were shaded…"). <strong>Hard</strong> — 8×8, never solvable by direct rules alone.</li>
    <li>Every board has exactly one solution. Boards come from a bank made and checked ahead of time, since finding one with a single answer takes seconds; each level has 150.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">A region of two cells is shaded outright. Every shaded cell needs a partner, so a shaded cell with only one free neighbour extends that way, and once a domino is complete its other neighbours are all empty. A cell touching two shaded cells can't be shaded.</p>
</template>
