<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hitori · games</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Hitori — shade cells so no number repeats in a row or column; shaded cells never touch and the rest stay connected. Daily puzzle, three difficulties, every puzzle has a unique answer.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../favicon.svg">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .ht-board {
    display: grid;
    gap: 2px;
    width: min(440px, 100%);
    aspect-ratio: 1;
    margin: 8px auto;
    padding: 2px;
    box-sizing: border-box;
    background: #3a352c;
    border-radius: 6px;
    user-select: none;
  }
  body.g-hitori .panel .ht-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    padding: 0;
    border: 0;
    border-radius: 3px;
    background: #ede8e1;
    color: #141210;
    font-size: clamp(0.95rem, 4.4vw, 1.4rem);
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }
  body.g-hitori .panel .ht-cell:hover { background: #f8f3ea; transform: none; }
  body.g-hitori .panel .ht-cell.shade,
  body.g-hitori .panel .ht-cell.shade:hover { background: #1a1715; color: #8a847c; }
  body.g-hitori .panel .ht-cell.circle::after {
    content: "";
    position: absolute;
    inset: 12%;
    border: 2px solid #2e6b4a;
    border-radius: 50%;
  }
  body.g-hitori .panel .ht-cell.err { color: #b3261e; }
  body.g-hitori .panel .ht-cell.shade.err { background: #5a1d1d; color: #ffb4ab; }
  body.g-hitori .panel .ht-cell.won { background: #cfe6c4; }
  body.g-hitori .panel .ht-board.solved .ht-cell { cursor: default; }
  .game-controls { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
</style>
</head>
<body class="g-hitori">
<main class="wrap">
  <div class="topbar">
    <h1>hitori</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status" aria-live="polite">Shade repeats. Keep the rest joined.</p>
      <p class="status">Time: <span id="time">0:00</span> · Best: <span id="best">—</span></p>
      <button class="btn ghost tool-btn man-trigger" data-man="hitori" data-man-title="HITORI(1)" type="button">
        <span class="q">?</span> man
      </button>
    </div>
    <div class="game-controls">
      <div class="chips" id="chips" role="group" aria-label="Difficulty">
        <button class="chip" data-diff="easy" type="button">Easy</button>
        <button class="chip" data-diff="medium" type="button">Medium</button>
        <button class="chip" data-diff="hard" type="button">Hard</button>
      </div>
      <button id="new-btn" class="btn ghost tool-btn" type="button"><span class="glyph">↻</span> new</button>
    </div>
    <div class="ht-board" id="board" role="group" aria-label="Hitori board"></div>
    <div class="toolbar">
      <button class="btn ghost tool-btn" id="undo-btn" type="button"><span class="glyph">↶</span> undo</button>
      <button class="btn ghost tool-btn" id="reset-btn" type="button"><span class="glyph">↻</span> reset</button>
    </div>
  </div>
</main>

<template id="man-hitori">
  <h2>Name</h2>
  <p>hitori — "alone": leave every number on its own.</p>

  <h2>Rules</h2>
  <ul>
    <li>Shade cells so that no number appears twice among the <strong>unshaded</strong> cells of any row or column.</li>
    <li>Shaded cells never touch side by side (diagonally is fine).</li>
    <li>All unshaded cells stay connected in one piece, side by side.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell to cycle: plain → shaded → circled (kept) → plain.</li>
    <li><strong>Right-click</strong> toggles a circle directly.</li>
    <li>Shaded cells that touch, and circled cells that repeat a number, turn red.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the board. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space cycles, <span class="kbd">X</span> toggles a circle.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 6×6, solvable with the opening patterns and direct rules. <strong>Medium</strong> — 8×8, needs look-ahead ("if this were shaded…"). <strong>Hard</strong> — 10×10, look-ahead across a bigger board.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">In X Y X the middle cell stays unshaded. When two equal numbers touch, one of them stays, so every other copy in that line is shaded. Circle every neighbour of a shaded cell, and never shade a cell that would cut the unshaded area in two.</p>
</template>

<script defer src="../manpage.js"></script>
<script defer src="../gamekit.js"></script>
<script defer src="game.js"></script>
</body>
</html>
