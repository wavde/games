<template id="man-jigsaw-sudoku">
  <h2>Name</h2>
  <p>jigsaw sudoku — sudoku whose boxes are irregular pieces.</p>

  <h2>Rules</h2>
  <ul>
    <li>Fill the n×n grid with 1 to n. Each number appears once in every row, every column, and every region (the shapes outlined in bold).</li>
    <li>Bold numbers are given and can't be changed.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell, then a number on the pad (or type it). <code>⌫</code>, Backspace, or 0 clears; entering the same number again clears it too.</li>
    <li><code>✎ notes</code> (or <span class="kbd">N</span>) switches to pencil marks. Repeated numbers turn red.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears your entries. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move between cells, type numbers directly. Screen readers announce each cell's region.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 6×6, solvable with singles (a cell with one candidate, or a number with one place in a row, column, or region). <strong>Medium</strong> — 8×8, needs look-ahead. <strong>Hard</strong> — 9×9, fewest givens that stay unique.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Where a region pokes into a row, compare them: if a row and a region overlap in all but one cell each, those two leftover cells must hold the same number. Scan each number across rows, columns, and regions for its last possible place.</p>
</template>
