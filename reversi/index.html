  body.g-reversi .panel .rv-cell {

    height: 100%;
    min-height: 0;

  body.g-reversi .panel .rv-cell:hover { background: #2e6b4a; }
  body.g-reversi .panel .rv-cell.hint { cursor: pointer; }
  body.g-reversi .panel .rv-cell.hint:hover { background: #377a55; }
  .rv-cell.hint::after {
    content: "";
    position: absolute;
    inset: 38%;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.28);
  }
  .rv-disc {
    position: absolute;
    inset: 9%;
    border-radius: 50%;
    box-shadow: 0 2px 3px rgba(0,0,0,0.45);
    transition: background .18s;

  .rv-disc.b { background: var(--ink); border: 1px solid #3a352c; }
  .rv-disc.w { background: var(--paper); border: 1px solid #c9c2b4; }
  .rv-cell.last .rv-disc { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rv-cell.flip .rv-disc { animation: rv-flip .22s ease-out; }
  @keyframes rv-flip { from { transform: scaleX(0.1); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .rv-cell.flip .rv-disc { animation: none; } .rv-disc { transition: none; } }
  .rv-score .dot { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; vertical-align: -0.05em; }

<template id="man-reversi">
  <h2>Name</h2>
  <p>reversi — outflank and flip your opponent's discs.</p>

  <h2>Rules</h2>
  <ul>
    <li>Black moves first. Place a disc so that one or more straight lines (across, down, or diagonal) of your opponent's discs are <strong>sandwiched</strong> between it and another of your discs.</li>
    <li>Every sandwiched disc flips to your color. A move must flip at least one disc.</li>
    <li>If you have no legal move, you pass. When neither side can move, the game ends.</li>
    <li>Whoever has more discs at the end wins.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a square with a dot — dots mark your legal moves.</li>
    <li>The last move is outlined. <code>↶ undo</code> takes back your last move (and the AI's reply).</li>
    <li>Pick an AI level and who goes first, or play <strong>2 players local</strong> on one device.</li>
    <li><strong>Online with a friend</strong> shows an invite link to send; paste the reply code your friend sends back to connect. The inviter plays black and moves first.</li>
    <li>Your win–loss–draw record against each AI level is kept on this device.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space plays a dotted square.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — looks 1 move ahead. <strong>Medium</strong> — 3 moves. <strong>Hard</strong> — 5 moves.</li>
    <li>The AI values corners and edges, avoids squares next to empty corners, and tries to limit your options.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Corners can never be flipped — grab them, and avoid the squares diagonally next to an empty corner. Early on, fewer discs is often better: keep your options open and your opponent's few.</p>
</template>
