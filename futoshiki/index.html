<template id="man-futoshiki">
  <h2>Name</h2>
  <p>futoshiki — 不等式, "inequality": a Latin square held together by greater-than signs.</p>

  <h2>Rules</h2>
  <ul>
    <li>Fill the n×n grid with the numbers 1 to n. Each number appears once in every row and every column.</li>
    <li>A sign between two cells must hold: <code>&lt;</code> and <code>&gt;</code> across, <code>∧</code> and <code>∨</code> down. The point always faces the smaller number.</li>
    <li>Shaded cells are given and can't be changed.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell, then a number on the pad (or type it). <code>⌫</code>, Backspace, or 0 clears; entering the same number again clears it too.</li>
    <li><code>✎ notes</code> (or <span class="kbd">N</span>) switches to pencil marks.</li>
    <li>Repeated numbers and broken signs turn red.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears your entries. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move between cells, type numbers directly. Screen readers announce each cell's signs.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 5×5, solvable by direct deduction. <strong>Medium</strong> — 6×6, needs look-ahead ("if this were a 4…"). <strong>Hard</strong> — 7×7.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">A cell bigger than a neighbour can't be 1; a chain of k signs going up needs room for k + 1 different numbers, so its ends are pushed toward 1 and n. When a number has only one place left in a row or column, it goes there.</p>
</template>
