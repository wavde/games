<template id="man-morris">
  <h2>Name</h2>
  <p>nine men's morris — a mill game played since Roman times.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each side has nine pieces. White starts. First, take turns <strong>placing</strong> a piece on any empty point.</li>
    <li>Once every piece is placed, take turns <strong>moving</strong> a piece along a line to a neighbouring empty point.</li>
    <li>Three of your pieces in a row along one line is a <strong>mill</strong>. Forming one lets you take an opponent's piece. Pieces in a mill are safe unless all of that side's pieces are in mills.</li>
    <li>Down to three pieces, a side may <strong>fly</strong>: move a piece to any empty point.</li>
    <li>You lose with two pieces left, or when you can't move. Twenty-five moves each without a capture after placing is a draw.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a point to place. To move, tap your piece, then where it goes (green dots). After a mill, tap the piece to take (pulsing red).</li>
    <li>Gold rings mark pieces standing in a mill. The score line shows pieces in hand / on the board.</li>
    <li><code>↶ undo</code> takes back to your last move (not after a finished game against the AI). Your win–loss–draw record against each AI level is kept on this device.</li>
    <li><strong>Online with a friend</strong>: pick it in the mode menu, send the invite link, then paste the reply code your friend sends back. The host plays White and moves first.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move between points, Enter or Space taps, <span class="kbd">Esc</span> drops a selected piece.</li>
  </ul>

  <h2>AI levels</h2>
  <ul>
    <li><strong>Easy</strong> looks two moves ahead and picks loosely. <strong>Medium</strong> looks four moves ahead. <strong>Hard</strong> searches as deep as it can in 0.8 s, remembering positions it has already scored.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">While placing, mobility matters more than early mills: the middle ring's side points have four neighbours. Aim for two lines that share an empty point, so one move threatens two mills. A mill you can open and close again each turn takes a piece every other move.</p>
</template>
