<template id="man-calcudoku">
  <h2>Name</h2>
  <p>calcudoku — a Latin square built from arithmetic cages.</p>

  <h2>Rules</h2>
  <ul>
    <li>Fill an n×n grid with the digits 1 to n so that no digit repeats in any row or column.</li>
    <li>Each outlined <strong>cage</strong> shows a target and an operation (+ − × ÷). Its digits must make the target with that operation — for − and ÷, take the larger number first. A cage with no sign is simply that digit.</li>
    <li>A digit may repeat inside a cage as long as the copies don't share a row or column.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell, then a digit on the pad (or type it). <code>⌫</code>, Backspace, or 0 clears; entering the same digit again clears it too.</li>
    <li><code>✎ notes</code> (or <span class="kbd">N</span>) switches to pencil marks.</li>
    <li>Repeated digits turn red. A cage's label dims when it's full and right, and turns red when it's full and wrong.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the board. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move between cells, type digits directly.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 4×4, solvable from the cages and lines alone. <strong>Medium</strong> — 5×5, needs look-ahead ("if this were a 3…"). <strong>Hard</strong> — 6×6 with bigger cages.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with single cells and tight cages: in a 5×5, 2÷ can only be 1·2 or 2·4, and 4− only 1·5. A product with a 5 in it must hold a 5. Then use the lines: each digit appears once per row and column.</p>
</template>
