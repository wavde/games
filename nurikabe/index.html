<template id="man-nurikabe">
  <h2>Name</h2>
  <p>nurikabe — paint the sea between the islands.</p>

  <h2>Rules</h2>
  <ul>
    <li>Shade cells as <strong>sea</strong>. The cells you leave unshaded form <strong>islands</strong>.</li>
    <li>Every island holds exactly one number, and has exactly that many cells.</li>
    <li>All the sea is connected, side by side, in one piece.</li>
    <li>No 2×2 block may be all sea.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell to cycle: empty → sea → dot (island) → empty. Numbered cells are always island.</li>
    <li><strong>Right-click</strong> toggles a dot directly.</li>
    <li>2×2 pools turn red, as do numbers whose dotted island already has too many cells or joins another number.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the board. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space cycles, <span class="kbd">X</span> toggles a dot.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 6×6, solvable with direct rules. <strong>Medium</strong> — 8×8, needs look-ahead ("if this were sea…"). <strong>Hard</strong> — 10×10, look-ahead across a bigger board.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Islands of 1 are surrounded by sea. A cell touching two numbered islands is sea. Cells too far from every number to be reached are sea. Three sea cells of a 2×2 force the fourth to be island, and the sea must never be walled off.</p>
</template>
