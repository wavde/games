<style>
  /* Board theme (moved from soft.css) */
  body.g-chess .panel .board {
    border: none;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  }
  body.g-chess .panel .sq.light { background: #d4b888; }
  body.g-chess .panel .sq.dark  { background: #8a6840; }
  body.g-chess .panel .sq.sel {
    outline: 3px solid var(--sun);
    outline-offset: -3px;
    z-index: 1;
  }
  body.g-chess .panel .sq.last {
    box-shadow: inset 0 0 0 3px rgba(245,184,0,0.45);
  }
  body.g-chess .panel .sq.hint::after { background: rgba(245,184,0,0.35); }
  body.g-chess .panel .sq.w {
    color: #f0e8d8;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  body.g-chess .panel .sq.b {
    color: #1a1210;
    text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  }
  body.g-chess .panel .board {
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(560px, 94vw);
    aspect-ratio: 1;
    margin: 0 auto;
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    overflow: hidden;
    touch-action: manipulation;
  }
  .sq {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.8rem, 8vw, 3.2rem);
    cursor: pointer;
    user-select: none;
    position: relative;
    line-height: 1;
  }
  /* Chess.com-style green + white board */
  .sq.light { background: #eeeed2; }
  .sq.dark  { background: #769656; }
  .sq.sel   { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
  .sq.last  { box-shadow: inset 0 0 0 3px rgba(245, 197, 66, 0.55); }
  .sq.hint::after {
    content: "";
    position: absolute;
    width: 28%; height: 28%;
    background: rgba(0, 0, 0, 0.22);
    border-radius: 50%;
  }
  .sq.cap::after {
    content: "";
    position: absolute;
    inset: 6%;
    border: 3px solid rgba(0, 0, 0, 0.35);
    border-radius: 50%;
  }
  .sq.w {
    color: #fff;
    -webkit-text-stroke: 1px #333;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }
  .sq.b {
    color: #000;
    -webkit-text-stroke: 0.5px #000;
    text-shadow: 0 1px 2px rgba(255,255,255,0.2);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  }

</style>
</head>
<body class="g-chess">
<main class="wrap">
  <div class="topbar">
    <h1>chess</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status" aria-live="polite">White to move.</p>
      <p class="status" id="info">Record: <span id="record">0 wins · 0 draws · 0 losses</span></p>
      <button class="btn ghost tool-btn man-trigger" data-man="chess" data-man-title="CHESS(1)" type="button">
        <span class="q">?</span> man
      </button>
    </div>
    <div class="game-controls">
      <div class="chips" id="chips" role="group" aria-label="AI difficulty">
        <button class="chip" data-diff="easy" type="button">Easy</button>
        <button class="chip" data-diff="medium" type="button">Medium</button>
        <button class="chip" data-diff="hard" type="button">Hard</button>
      </div>
      <select id="mode" aria-label="Mode">
        <option value="ai-w" selected>Play White vs AI</option>
        <option value="ai-b">Play Black vs AI</option>
        <option value="local">2 players (this device)</option>
        <option value="online">Online with a friend</option>
      </select>
    </div>
    <div class="board" id="board"></div>
    <p class="footer-note">Tap a piece, then tap a destination. Pawns auto-promote to queen.</p>
    <div class="toolbar">
      <button class="btn ghost tool-btn" id="undo-btn" type="button"><span class="glyph">↶</span> undo</button>
      <button class="btn ghost tool-btn" id="flip-btn" type="button"><span class="glyph">⇅</span> flip</button>
      <button class="btn primary" id="new-btn" type="button">↻ new game</button>
    </div>
  </div>
</main>

<template id="man-chess">
  <h2>Name</h2>
  <p>chess — full rules vs. a small minimax engine.</p>

  <h2>Rules</h2>
  <ul>
    <li>Standard chess: pieces move as they do in real chess, including <strong>castling</strong>, <strong>en passant</strong>, and <strong>pawn promotion</strong> (auto-queens).</li>
    <li>Deliver <strong>checkmate</strong> to win; the game ends in a draw on stalemate, insufficient material, or 50-move rule.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> one of your pieces to select it. Legal destinations are highlighted with dots (moves) or rings (captures).</li>
    <li><strong>Tap a highlighted square</strong> to move there. Tap the piece again to deselect.</li>
    <li>Pick the AI strength with the <code>Easy</code> / <code>Medium</code> / <code>Hard</code> chips (search depth 1, 2 and 3) and how to play with the mode selector: <code>Play White vs AI</code>, <code>Play Black vs AI</code>, <code>2 players (this device)</code> or <code>Online with a friend</code>. Either change starts a new game.</li>
    <li><code>↶ undo</code> takes back one full pair of moves (yours + the engine's), even after the game has ended; with 2 players on one device it takes back one move.</li>
    <li><strong>Online with a friend</strong>: send the invite link, paste back the reply code your friend gets, and play on two devices with no server. You host as White and move first; your friend plays Black with the board turned round. Undo is off online, <code>↻ new game</code> restarts both boards, and online games don't count toward the record.</li>
    <li><code>⇅ flip</code> rotates the view. <code>↻ new game</code> starts over.</li>
    <li>The stats line shows your wins · draws · losses against the current AI level, kept on this device. Each game counts once, when it ends; abandoning a game counts nothing.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space selects a piece, then its destination.</li>
  </ul>

  <h2>Notes</h2>
  <p class="muted">The engine uses minimax with alpha-beta pruning and piece-square tables. At depth 3 it plays a decent casual game.</p>
</template>
