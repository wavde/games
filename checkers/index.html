<style>
  .ck-board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(440px, 100%);
    aspect-ratio: 1;
    margin: 8px auto;
    border: 6px solid #4a2e1c;
    border-radius: var(--r-md);
    box-sizing: border-box;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .ck-light { background: #e6d5b8; }
  body.g-checkers .panel .ck-cell {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    min-width: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: #8b5a3c;
    cursor: default;
  }
  body.g-checkers .panel .ck-cell:hover { background: #8b5a3c; }
  body.g-checkers .panel .ck-cell.last,
  body.g-checkers .panel .ck-cell.last:hover { background: #a0703f; }
  body.g-checkers .panel .ck-cell.can,
  body.g-checkers .panel .ck-cell.dest { cursor: pointer; }
  body.g-checkers .panel .ck-cell.dest:hover { background: #9c6a48; }
  .ck-cell.dest::after {
    content: "";
    position: absolute;
    inset: 36%;
    border-radius: 50%;
    background: rgba(245, 197, 66, 0.75);
  }
  .ck-piece {
    position: absolute;
    inset: 11%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.9rem, 4.5vw, 1.4rem);
    line-height: 1;
    box-shadow: 0 2px 3px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(255,255,255,0.08);
  }
  .ck-piece.b { background: var(--ink); border: 1px solid #3a352c; color: #f5c542; }
  .ck-piece.w { background: var(--paper); border: 1px solid #c9c2b4; color: #6b4e00; }
  .ck-cell.can .ck-piece { outline: 2px solid rgba(245, 197, 66, 0.6); outline-offset: 1px; }
  .ck-cell.sel .ck-piece { outline: 3px solid var(--accent); outline-offset: 1px; }
  .ck-cell.cap .ck-piece { opacity: 0.35; }
  .ck-score .dot { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; vertical-align: -0.05em; }
  .ck-score .dot.b { background: var(--ink); border: 1px solid var(--muted); }
  .ck-score .dot.w { background: var(--paper); }

<template id="man-checkers">
  <h2>Name</h2>
  <p>checkers — English draughts on an 8×8 board.</p>

  <h2>Rules</h2>
  <ul>
    <li>Black moves first. Pieces move one square <strong>diagonally forward</strong> on the dark squares.</li>
    <li>Capture by <strong>jumping</strong> over an adjacent enemy piece to the empty square beyond. Captures are <strong>compulsory</strong> — if any jump is available, you must take one (any one, not necessarily the longest).</li>
    <li>After a jump, keep jumping with the same piece while you can — a <strong>multi-jump</strong> is a single move.</li>
    <li>A piece reaching the far row becomes a <strong>king</strong> (♛) and may move and jump backwards too. Being crowned ends the move.</li>
    <li>You lose when you have no legal move — no pieces left, or all of them blocked. Forty moves each with no capture and no plain piece moving forward is a draw.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> one of your outlined pieces, then a highlighted square. For a multi-jump, tap each landing square in turn.</li>
    <li>Tap the selected piece again (or press Esc) to choose a different one. The last move's squares are shaded.</li>
    <li><code>↶ undo</code> takes back your last move (and the AI's reply). Pick an AI level and who goes first, or play <strong>2 players local</strong> on one device.</li>
    <li>Your win–loss–draw record against each AI level is kept on this device.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move between dark squares, Enter or Space selects and moves, Esc cancels.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — looks 2 moves ahead. <strong>Medium</strong> — 4 moves. <strong>Hard</strong> — 8 moves.</li>
    <li>Every level follows capture sequences to the end, so the AI won't blunder into a simple jump.</li>
    <li>Two kings against one is played perfectly — it can take up to 17 moves, but it's always a win.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Keep your back row filled as long as you can — it stops the opponent from crowning. Trade pieces when you're ahead, and try to offer one piece to win two.</p>
</template>
