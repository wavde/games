<template id="man-star-battle">
  <h2>Name</h2>
  <p>star battle — place two stars in every row, column, and region.</p>

  <h2>Rules</h2>
  <ul>
    <li>Every row, every column, and every coloured region holds exactly <strong>two stars</strong>.</li>
    <li>Stars never touch — not even diagonally.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell to cycle: empty → star → dot (marked empty) → empty.</li>
    <li><strong>Right-click</strong> toggles a dot directly.</li>
    <li>Stars that touch, or that crowd a row, column, or region past two, turn red.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the board. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space cycles star/dot, <span class="kbd">X</span> toggles a dot.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 8×8, solvable by looking at one row, column, or region at a time. <strong>Medium</strong> — 9×9, needs look-ahead ("if a star went here…"). <strong>Hard</strong> — 10×10, needs look-ahead too.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Dot every cell around a star. A small region often has only a few ways to fit two stars — any cell next to all of them is empty. If three regions fit entirely inside three rows, they use all six of those rows' stars, so the rest of those rows is empty.</p>
</template>
