<style>
  .tg-grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 2px;
    width: min(440px, 92vw);
    aspect-ratio: 1;
    margin: 8px auto;
    padding: 2px;
    box-sizing: border-box;
    background: var(--rule);
    border: 2px solid var(--ink);
    border-radius: 6px;
  }
  body.g-tango .panel .tg-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding: 0;
    border: 0;
    border-radius: 2px;
    background: var(--paper);
    color: var(--ink-faint);
    font-size: clamp(1.8rem, 8vw, 2.6rem);
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    user-select: none;
  }
  body.g-tango .panel .tg-cell:hover { background: var(--paper-hover); }
  body.g-tango .panel .tg-cell.given { background: var(--paper-given); cursor: default; }
  body.g-tango .panel .tg-cell.sun { color: transparent; }
  body.g-tango .panel .tg-cell.sun::before {
    content: "";
    position: absolute;
    inset: 24%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffcf5a, #d98a00 70%);
    box-shadow: 0 0 0 2px #a65f00;
  }
  body.g-tango .panel .tg-cell.error.sun::before { box-shadow: 0 0 0 3px var(--ink-error); }
  body.g-tango .panel .tg-cell.moon { color: #34509e; }
  body.g-tango .panel .tg-cell.error { box-shadow: inset 0 0 0 3px var(--ink-error); }
  body.g-tango .panel .tg-cell.error.moon { color: var(--ink-error); }

  /* Edge badges between neighbours: = same, × different */
  .tg-edge {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    min-width: 14px;
    padding: 1px 4px;
    border: 1px solid var(--ink);
    border-radius: 6px;
    background: var(--paper-light);
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    text-align: center;
  }
</style>
</head>
<body class="g-tango">
<main class="wrap">
  <div class="topbar">
    <h1>tango</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status">Fill with suns and moons.</p>
      <p class="status">Time: <span id="time">0:00</span> · Best: <span id="best">—</span></p>
      <button class="btn ghost tool-btn man-trigger" data-man="tango" data-man-title="TANGO(1)" type="button">
        <span class="q">?</span> man
      </button>
    </div>
    <div class="game-controls">
      <div class="chips" id="chips" role="group" aria-label="Difficulty">
        <button class="chip" data-diff="easy" type="button">Easy</button>
        <button class="chip" data-diff="medium" type="button">Medium</button>
        <button class="chip" data-diff="hard" type="button">Hard</button>
      </div>
      <button class="btn ghost tool-btn" id="new-btn" type="button"><span class="glyph">↻</span> new</button>
    </div>
    <div class="tg-grid" id="board"></div>
    <div class="toolbar">
      <button class="btn ghost tool-btn" id="undo-btn" type="button"><span class="glyph">↶</span> undo</button>
      <button class="btn ghost tool-btn" id="hint-btn" type="button"><span class="glyph">💡</span> hint</button>
      <button class="btn ghost tool-btn" id="reset-btn" type="button"><span class="glyph">↻</span> reset</button>
    </div>
  </div>
</main>

<template id="man-tango">
  <h2>Name</h2>
  <p>tango — balance suns and moons.</p>

  <h2>Rules</h2>
  <ul>
    <li>The grid is 6×6. Every cell must hold a <strong>sun</strong> (yellow) or <strong>moon</strong> (blue).</li>
    <li>No three of the same symbol may be adjacent in any row or column.</li>
    <li>Each row and column must contain exactly <strong>three suns and three moons</strong>.</li>
    <li>A green <code>=</code> between two cells means they must be <strong>the same</strong>.</li>
    <li>An amber <code>×</code> between two cells means they must be <strong>different</strong>.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap a cell</strong> to cycle: empty → sun → moon → empty.</li>
    <li><code>↶ undo</code> takes back one entry.</li>
    <li><code>💡 hint</code> reveals one correct cell (use sparingly).</li>
    <li><code>↻ reset</code> clears your entries; <code>↻ new</code> generates a fresh puzzle.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space cycles the cell.</li>
  </ul>

  <h2>Difficulty</h2>
  <p class="muted">Harder puzzles give fewer starting cells and fewer edge clues — you'll lean more on the "no three in a row" and row/column balance rules.</p>
</template>
