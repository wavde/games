<style>
  /* Board theme (moved from soft.css) */
  body.g-tango .panel .tg-grid {
    background: var(--bg);
    border: none;
    border-radius: 16px;
    padding: 10px;
    gap: 8px;
  }
  body.g-tango .panel .tg-cell {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--dim);
    font-weight: 700;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  body.g-tango .panel .tg-cell.given {
    border-color: var(--border-hi);
  }
  /* ☀ Sun — warm golden glow */
  body.g-tango .panel .tg-cell.sun {
    color: var(--sun);
    text-shadow: 0 0 12px rgba(245,184,0,0.45);
    background: rgba(245,184,0,0.08);
    font-size: clamp(1.8rem, 8vw, 2.6rem);
  }
  body.g-tango .panel .tg-cell.given.sun {
    background: rgba(245,184,0,0.14);
  }
  /* ☾ Moon — cool indigo glow */
  body.g-tango .panel .tg-cell.moon {
    color: var(--moon);
    text-shadow: 0 0 12px rgba(139,156,247,0.45);
    background: rgba(139,156,247,0.08);
    font-size: clamp(1.8rem, 8vw, 2.6rem);
  }
  body.g-tango .panel .tg-cell.given.moon {
    background: rgba(139,156,247,0.14);
  }
  body.g-tango .panel .tg-cell.error {
    border-color: var(--coral);
    box-shadow: inset 0 0 0 2px rgba(255,107,107,0.3);
  }
  /* Edge constraint badges */
  body.g-tango .panel .tg-edge {
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--border-hi);
    border-radius: 6px;
    font-weight: 700;
  }
  body.g-tango .panel .tg-edge.eq {
    color: var(--teal);
    border-color: var(--teal);
    background: rgba(77,217,172,0.12);
  }
  body.g-tango .panel .tg-edge.neq {
    color: var(--sun);
    border-color: var(--sun);
    background: rgba(245,184,0,0.10);
  }
  .tg-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 8px;
    width: min(440px, 92vw);
    aspect-ratio: 1;
    margin: 8px auto;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 10px;
    position: relative;
  }
  .tg-cell {
    position: relative;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.4rem, 6.5vw, 2rem);
    cursor: pointer;
    user-select: none;
    color: var(--dim);
    min-width: 0;
    padding: 0;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  .tg-cell.given { background: var(--bg-2); border-color: var(--border-hi); font-weight: 700; cursor: default; }
  .tg-cell.sun  { color: var(--accent); }
  .tg-cell.moon { color: var(--accent-2); }
  .tg-cell.error { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }

  /* Edge badges */
  .tg-edge {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-sm);
    padding: 1px 4px;
    min-width: 14px;
    text-align: center;
  }
  .tg-edge.eq  { color: var(--accent-2); border-color: var(--accent-2); }
  .tg-edge.neq { color: var(--accent);   border-color: var(--accent); }

  .game-controls { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
</style>
</head>
<body class="g-tango">
<main class="wrap">
  <div class="topbar">
    <h1>tango</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status">Fill with suns and moons.</p>
      <p class="status">Time: <span id="time">0:00</span> · Best: <span id="best">—</span></p>
      <button class="btn ghost tool-btn man-trigger" data-man="tango" data-man-title="TANGO(1)" type="button">
        <span class="q">?</span> man
      </button>
    </div>
    <div class="game-controls">
      <div class="chips" id="chips" role="group" aria-label="Difficulty">
        <button class="chip" data-diff="easy" type="button">Easy</button>
        <button class="chip" data-diff="medium" type="button">Medium</button>
        <button class="chip" data-diff="hard" type="button">Hard</button>
      </div>
      <button class="btn ghost tool-btn" id="new-btn" type="button"><span class="glyph">↻</span> new</button>
    </div>
    <div class="tg-grid" id="board"></div>
    <div class="toolbar">
      <button class="btn ghost tool-btn" id="undo-btn" type="button"><span class="glyph">↶</span> undo</button>
      <button class="btn ghost tool-btn" id="hint-btn" type="button"><span class="glyph">💡</span> hint</button>
      <button class="btn ghost tool-btn" id="reset-btn" type="button"><span class="glyph">↻</span> reset</button>
    </div>
  </div>
</main>

<template id="man-tango">
  <h2>Name</h2>
  <p>tango — balance suns and moons.</p>

  <h2>Rules</h2>
  <ul>
    <li>The grid is 6×6. Every cell must hold a <strong>sun</strong> (yellow) or <strong>moon</strong> (blue).</li>
    <li>No three of the same symbol may be adjacent in any row or column.</li>
    <li>Each row and column must contain exactly <strong>three suns and three moons</strong>.</li>
    <li>A green <code>=</code> between two cells means they must be <strong>the same</strong>.</li>
    <li>An amber <code>×</code> between two cells means they must be <strong>different</strong>.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap a cell</strong> to cycle: empty → sun → moon → empty.</li>
    <li><code>↶ undo</code> takes back one entry.</li>
    <li><code>💡 hint</code> reveals one correct cell (use sparingly).</li>
    <li><code>↻ reset</code> clears your entries; <code>↻ new</code> generates a fresh puzzle.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space cycles the cell.</li>
  </ul>

  <h2>Difficulty</h2>
  <p class="muted">Harder puzzles give fewer starting cells and fewer edge clues — you'll lean more on the "no three in a row" and row/column balance rules.</p>
</template>

<script defer src="../manpage.js"></script>
<script defer src="../gamekit.js"></script>
<script defer src="game.js"></script>
</body>
</html>
