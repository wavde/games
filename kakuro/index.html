<template id="man-kakuro">
  <h2>Name</h2>
  <p>kakuro — cross sums, a crossword made of numbers.</p>

  <h2>Rules</h2>
  <ul>
    <li>Fill every light cell with a digit from 1 to 9.</li>
    <li>A <strong>run</strong> is an unbroken line of light cells. The clue before it gives the run's total: the number above the diagonal is for the run to the right, the number below it is for the run going down.</li>
    <li>No digit may repeat within a run.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell, then a digit on the pad (or type 1–9). <code>⌫</code>, Backspace, or 0 clears it; entering the same digit again clears it too.</li>
    <li><code>✎ notes</code> (or <span class="kbd">N</span>) switches to pencil marks: digits toggle as small candidates instead.</li>
    <li>Repeated digits turn red. A clue dims once its run is full and correct, and turns red if the run overshoots.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the board. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board and use the arrow keys to move between cells; type digits directly.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 6×6, runs up to 4 long, solvable from the sums alone. <strong>Medium</strong> — 7×7, runs up to 5, needs look-ahead ("if this were a 7…"). <strong>Hard</strong> — 8×8, runs up to 5, look-ahead across more of the board.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Some totals allow only one set of digits: 3 in two cells is 1+2, 4 in two is 1+3, 16 in two is 7+9, 6 in three is 1+2+3, 24 in three is 7+8+9. Where an across and a down run cross, the cell must hold a digit both allow.</p>
</template>
