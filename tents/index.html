<style>
  .tn-board {
    display: grid;
    gap: 2px;
    width: min(460px, 100%);
    aspect-ratio: 1;
    margin: 8px auto;
    user-select: none;
  }
  .tn-count {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.85rem, 3.6vw, 1.15rem);
    font-weight: 700;
    color: var(--fg);
  }
  .tn-count.ok { color: var(--muted); }
  .tn-count.bad { color: var(--danger); }
  .tn-tree, body.g-tents .panel .tn-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    padding: 0;
    border: 0;
    border-radius: 3px;
    background: #ede8e1;
  }
  body.g-tents .panel .tn-cell { cursor: pointer; }
  body.g-tents .panel .tn-cell:hover { background: #f6f1e8; transform: none; }
  .tn-tree { background: #dbe7cf; }
  .tn-tree::before, .tn-tree::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); }
  .tn-tree::before { bottom: 10%; width: 12%; height: 30%; background: #6b4a2b; }
  .tn-tree::after {
    top: 10%;
    width: 60%;
    height: 60%;
    border-radius: 50%;
    background: #2f6b2a;
    box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.18);
  }
  body.g-tents .panel .tn-cell.grass { background: #cfe0b8; }
  body.g-tents .panel .tn-cell.grass::before {
    content: "";
    width: 14%;
    height: 14%;
    border-radius: 50%;
    background: #5b7f3a;
  }
  body.g-tents .panel .tn-cell.tent::before {
    content: "";
    width: 66%;
    height: 58%;
    background: #c0602a;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  body.g-tents .panel .tn-cell.tent.err::before { background: #b3261e; }
  body.g-tents .panel .tn-cell.err { box-shadow: inset 0 0 0 2px #b3261e; }
  body.g-tents .panel .tn-board.solved .tn-cell { background: #cfe6c4; cursor: default; }

<body class="g-tents">
<main class="wrap">

    </div>
  </div>
</main>

<template id="man-tents">
  <h2>Name</h2>
  <p>tents — a campsite where every tree gets exactly one tent.</p>

  <h2>Rules</h2>
  <ul>
    <li>Pitch one tent for each tree, directly above, below, left, or right of it. Each tent belongs to its own tree.</li>
    <li>Tents never touch each other, not even diagonally.</li>
    <li>The numbers along the top and left say how many tents stand in that column or row.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a square to cycle empty → tent → grass. <strong>Right-click</strong> toggles grass directly. Grass is just a note to yourself: "no tent here".</li>
    <li>Touching tents turn red. A count dims when it's met and turns red when it's exceeded.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the field. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space cycles, <span class="kbd">X</span> toggles grass.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 6×6, solvable by direct deduction. <strong>Medium</strong> — 8×8, needs look-ahead ("if a tent went here…"). <strong>Hard</strong> — 10×10.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with the zeros, and with squares that touch no tree: all grass. A tree with only one open side gets its tent there. A row whose open squares exactly fill its count is all tents. Every tent turns its eight neighbours to grass.</p>
</template>
