<meta name="description" content="Sokoban — push every box onto a goal. Generated, solver-checked rooms with a par push count; daily puzzle and three difficulties.">

<style>
  .sk-board {
    display: grid;
    width: min(420px, 100%);
    aspect-ratio: 1;
    margin: 8px auto;
    border-radius: 8px;
    overflow: hidden;
    user-select: none;
    touch-action: none;
    cursor: pointer;
  }
  .sk-c { position: relative; }
  .sk-c.wall { background: #4a4038; box-shadow: inset 0 0 0 1px #3a322b; }
  .sk-c.floor { background: #2a2622; }
  .sk-c.goal::before {
    content: "";
    position: absolute;
    inset: 34%;
    border-radius: 50%;
    border: 2px solid #f5b800;
  }
  .sk-c.box::after {
    content: "";
    position: absolute;
    inset: 10%;
    border-radius: 4px;
    background: #b07a3c;
    box-shadow: inset 0 0 0 3px #8a5a28, inset 0 0 0 6px #b07a3c, inset 0 0 0 7px #8a5a28;
  }
  .sk-c.box.goal::after { background: #6dd58c; box-shadow: inset 0 0 0 3px #3f9a5c, inset 0 0 0 6px #6dd58c, inset 0 0 0 7px #3f9a5c; }
  .sk-c.me::after {
    content: "";
    position: absolute;
    inset: 18%;
    border-radius: 50%;
    background: #ede8e1;
    box-shadow: 0 0 0 3px #5c84ab;
  }
  .sk-board.solved { cursor: default; }
  .game-controls { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
  .sk-meta { text-align: center; margin: 0; font-size: var(--fs-sm); color: var(--muted); }
</style>
</head>
<body class="g-sokoban">
<main class="wrap">
  <div class="topbar">
    <h1>sokoban</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status" aria-live="polite">Push every box onto a goal.</p>
      <p class="status">Time: <span id="time">0:00</span> · Best: <span id="best">—</span></p>
      <button class="btn ghost tool-btn man-trigger" data-man="sokoban" data-man-title="SOKOBAN(1)" type="button">
        <span class="q">?</span> man
      </button>
    </div>
    <div class="game-controls">
      <div class="chips" id="chips" role="group" aria-label="Difficulty">
        <button class="chip" data-diff="easy" type="button">Easy</button>
        <button class="chip" data-diff="medium" type="button">Medium</button>
        <button class="chip" data-diff="hard" type="button">Hard</button>
      </div>
      <button id="new-btn" class="btn ghost tool-btn" type="button"><span class="glyph">↻</span> new</button>
    </div>
    <p class="sk-meta"><span id="moves">0 moves, 0 pushes</span> · par <span id="par">—</span> pushes</p>
    <div class="sk-board" id="board" role="img" aria-label="Sokoban room"></div>
    <div class="toolbar">
      <button class="btn ghost tool-btn" id="undo-btn" type="button"><span class="glyph">↶</span> undo</button>
      <button class="btn ghost tool-btn" id="reset-btn" type="button"><span class="glyph">↻</span> restart</button>
    </div>
  </div>
</main>

<template id="man-sokoban">
  <h2>Name</h2>
  <p>sokoban — "warehouse keeper": push the boxes into place.</p>

  <h2>Rules</h2>
  <ul>
    <li>Walk around the room and <strong>push</strong> boxes onto the goal rings — one box per goal.</li>
    <li>You can only push, never pull, and only one box at a time. Boxes can't go through walls or other boxes.</li>
    <li>A box pushed into a corner (or flat against a wall with no goal along it) is stuck for good — undo is your friend.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Arrow keys</strong> or <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> step and push; <span class="kbd">U</span> or <span class="kbd">Z</span> undoes.</li>
    <li><strong>Swipe</strong> on the room to step. <strong>Tap</strong> a box next to you to push it, or tap any floor you can reach to walk there.</li>
    <li><code>↶ undo</code> takes back one step (or one walk); <code>↻ restart</code> puts the room back; <code>↻ new</code> rolls a fresh room — the daily room loads by default.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 2 boxes. <strong>Medium</strong> — 3 boxes. <strong>Hard</strong> — 4 boxes in a larger room.</li>
    <li>Every room is generated backwards from the solved position, so it's always solvable. <strong>Par</strong> is the fewest pushes possible, found by a solver.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Before each push, check the box can still be pushed off again afterwards. Keep corridors clear, and work out which box has to go to the far goal first.</p>
</template>
