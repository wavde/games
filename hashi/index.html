    z-index: 1;

<template id="man-hashi">
  <h2>Name</h2>
  <p>hashi — build bridges between numbered islands (also called <em>Bridges</em>).</p>

  <h2>Rules</h2>
  <ul>
    <li>Each island's number is how many bridges must touch it.</li>
    <li>Bridges run straight across or down between two islands, with nothing in between.</li>
    <li>At most <strong>two</strong> bridges join any pair of islands, and bridges <strong>never cross</strong>.</li>
    <li>When you're done, every island must be linked into <strong>one connected network</strong>.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> an island, then tap a neighbor (dashed outline) to add a bridge. Or <strong>drag</strong> from one island to another.</li>
    <li>Tapping the water between two islands works too.</li>
    <li>Each tap cycles 0 → 1 → 2 → 0 bridges. Finished islands turn green; overfull ones turn red.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the board. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move, Enter or Space selects an island, then Enter on a neighbor adds a bridge.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 7×7, solvable with counting rules alone. <strong>Medium</strong> — 9×9, needs some look-ahead ("if this were a double bridge…"). <strong>Hard</strong> — 11×11, more islands and loops, deeper look-ahead.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with islands that leave no choice: a 4 with two neighbors needs double bridges to both; an 8 needs doubles everywhere. A 1 next to only a 1 can't connect to it (they'd be cut off). Count each island's remaining capacity as you go.</p>
</template>
