<template id="man-mancala">
  <h2>Name</h2>
  <p>mancala — sow seeds around the board (the <em>Kalah</em> rules).</p>

  <h2>Rules</h2>
  <ul>
    <li>Each player owns the six pits on their side and the store on their right. Every pit starts with 4 seeds.</li>
    <li>On your turn, pick up every seed in one of your pits and <strong>sow</strong> them one by one, counter-clockwise, into the following pits — your store included, your opponent's store skipped.</li>
    <li>If your last seed lands in <strong>your store</strong>, you move again.</li>
    <li>If your last seed lands in an <strong>empty pit on your side</strong> and the pit opposite has seeds, you <strong>capture</strong> both into your store.</li>
    <li>When either side runs out of seeds, each player adds the seeds left on their side to their store. Most seeds wins.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> one of your outlined pits to sow it. The last pit played is ringed in green.</li>
    <li><code>↶ undo</code> takes back your last move (and the AI's reply). Pick an AI level and who goes first, or play <strong>2 players local</strong> — bottom row against top row.</li>
    <li>Your win–loss–draw record against each AI level is kept on this device.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move between pits, Enter or Space sows.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — looks 2 moves ahead and sometimes settles for a slightly worse move. <strong>Medium</strong> — 6 moves. <strong>Hard</strong> — searches as deep as it can in under a second.</li>
    <li>Extra turns count as moves, so the AI sees chains of them.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Chain extra turns: a pit holding exactly as many seeds as it is away from your store lands in it. Watch your empty pits — and your opponent's — for captures, and keep a few seeds on your side for the endgame.</p>
</template>
