<template id="man-skyscrapers">
  <h2>Name</h2>
  <p>skyscrapers — a city skyline seen from its four edges.</p>

  <h2>Rules</h2>
  <ul>
    <li>Fill the n×n grid with towers of height 1 to n. Each height appears once in every row and every column.</li>
    <li>A number outside the grid says how many towers you can <strong>see</strong> looking in from that edge: a taller tower hides every shorter one behind it.</li>
    <li>Edges without a number can show any count.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell, then a height on the pad (or type it). <code>⌫</code>, Backspace, or 0 clears; entering the same height again clears it too.</li>
    <li><code>✎ notes</code> (or <span class="kbd">N</span>) switches to pencil marks.</li>
    <li>Repeated heights turn red. A clue dims when its line is full and right, and turns red when it's full and wrong.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the board. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move between cells, type heights directly.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 4×4, solvable a line at a time. <strong>Medium</strong> — 5×5, needs look-ahead ("if this were a 4…"). <strong>Hard</strong> — 6×6.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">A 1 means the tallest tower stands right next to it. An n means the line climbs 1, 2, … n. Next to a clue of k, the tallest tower is at least k − 1 cells in. Work each line against both its clues, then cross-check with the columns.</p>
</template>
