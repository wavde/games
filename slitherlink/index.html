<style>
  .sl-board {
    --dot: 8px;
    display: grid;
    width: min(440px, 100%);
    aspect-ratio: 1;
    margin: 8px auto;
    padding: 14px;
    box-sizing: border-box;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 6px;
    user-select: none;
  }
  .sl-dot { background: var(--ink); border-radius: 50%; position: relative; z-index: 3; pointer-events: none; }
  .sl-cell { display: grid; place-items: center; font-weight: 700; font-size: clamp(14px, 4.4vw, 21px); color: var(--ink); }
  .sl-cell.ok { color: #8f887d; }
  .sl-cell.over { color: var(--ink-error); }
  body.g-slitherlink .panel .sl-line {
    position: relative;
    min-height: 0;
    min-width: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    z-index: 2;
    cursor: pointer;
  }
  body.g-slitherlink .panel .sl-line:hover,
  body.g-slitherlink .panel .sl-line:active { background: transparent; transform: none; }
  .sl-line::before {
    content: "";
    position: absolute;
    border-radius: 3px;
    background: transparent;
    transition: background .12s;
  }
  .sl-line::after { content: ""; position: absolute; }
  .sl-h::before { left: -2px; right: -2px; top: 50%; height: 5px; transform: translateY(-50%); }
  .sl-v::before { top: -2px; bottom: -2px; left: 50%; width: 5px; transform: translateX(-50%); }
  .sl-h::after { left: 0; right: 0; top: -14px; bottom: -14px; }
  .sl-v::after { top: 0; bottom: 0; left: -14px; right: -14px; }
  .sl-line:not(.on):not(.x):hover::before { background: var(--rule); }
  .sl-line.on::before { background: var(--ink); }
  .sl-line.bad::before { background: var(--ink-error); }
  .sl-line.x::before {
    left: 50%; right: auto; top: 50%; bottom: auto;
    width: 10px; height: 10px;
    transform: translate(-50%, -50%);
    border-radius: 0;
    background:
      linear-gradient(45deg, transparent 42%, var(--ink-faint) 42%, var(--ink-faint) 58%, transparent 58%),
      linear-gradient(-45deg, transparent 42%, var(--ink-faint) 42%, var(--ink-faint) 58%, transparent 58%);
  }
  .sl-board.solved .sl-line.on::before { background: #2f6b2a; }
  .sl-board.solved .sl-line { cursor: default; }
  @media (prefers-reduced-motion: reduce) { .sl-line::before { transition: none; } }
</style>

<template id="man-slitherlink">
  <h2>Name</h2>
  <p>slitherlink — draw a single loop through the dots (also called <em>Loop the Loop</em>).</p>

  <h2>Rules</h2>
  <ul>
    <li>Connect neighbouring dots with lines to make <strong>one closed loop</strong>. It may not cross itself or branch.</li>
    <li>A number tells how many of that cell's four sides the loop uses. Blank cells can have any number.</li>
    <li>The loop doesn't have to visit every dot.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> between two dots to cycle: empty → line → × (marked unused) → empty.</li>
    <li><strong>Right-click</strong> toggles an × directly.</li>
    <li>A number dims once it has exactly its lines and turns red with too many; lines meeting three or more at a dot turn red.</li>
    <li><code>↶ undo</code> takes back one change; <code>↻ reset</code> clears the board. <code>↻ new</code> rolls a fresh puzzle; the daily puzzle loads by default.</li>
    <li><strong>Keyboard</strong>: Tab to the board, arrow keys move between lines, Enter or Space cycles line/×, <span class="kbd">X</span> toggles an ×.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — 6×6, solvable with direct rules alone. <strong>Medium</strong> — 7×7, needs some look-ahead ("if a line went here…"). <strong>Hard</strong> — 8×8, fewer clues, deeper look-ahead.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with 0s: × all four sides. Every dot has 0 or 2 lines — a dot with one line and one free side must continue there. Two 3s side by side share the line between them plus their outer sides. A 3 in a corner uses both corner sides. Never close a small loop while other numbers still need lines.</p>
</template>
